<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo Portal del Cliente</title>
<meta name="description" content="Prototipo navegable de la App Portal del Cliente · CRM Andino Perú · Proyecto Final, Semana 11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1F3A5F; --azul-osc:#142842; --turq:#1B998B; --dorado:#F2A93B; --rojo:#C0392B; --verde:#1E9E5A;
  --fondo:#F5F7FA; --sup:#FFFFFF; --nieve:#E8EEF5; --txt:#1C2430; --txt2:#5B6675; --borde:#D6DEE8;
  --pag:#EEF2F7; --pag-txt:#1C2430; --pag-txt2:#5B6675; --panel:#FFFFFF; --panel-borde:#D6DEE8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --pag:#0F1724; --pag-txt:#E8EEF5; --pag-txt2:#A3B1C2; --panel:#172234; --panel-borde:#26354B; }
}
:root[data-theme="dark"]{ --pag:#0F1724; --pag-txt:#E8EEF5; --pag-txt2:#A3B1C2; --panel:#172234; --panel-borde:#26354B; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pag);color:var(--pag-txt);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.cab{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--panel-borde);background:var(--panel)}
.cab svg{width:36px;height:36px;flex:none}
.cab h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.cab p{margin:2px 0 0;font-size:13px;color:var(--pag-txt2)}
.cab .der{margin-left:auto;display:flex;gap:8px}
.btn-pag{border:1px solid var(--panel-borde);background:transparent;color:var(--pag-txt);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.btn-pag[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.lay{display:grid;grid-template-columns:250px minmax(380px,1fr) 340px;gap:24px;padding:24px;max-width:1320px;margin:0 auto;align-items:start}
nav.mapa{background:var(--panel);border:1px solid var(--panel-borde);border-radius:16px;padding:12px;position:sticky;top:16px}
.mapa h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pag-txt2);margin:12px 8px 6px}
.mapa h2:first-child{margin-top:4px}
.mapa button{display:flex;width:100%;text-align:left;border:0;background:transparent;color:var(--pag-txt);padding:8px 10px;border-radius:10px;font-size:14px;gap:8px;align-items:center}
.mapa button .n{font:500 11px "Roboto Mono",monospace;color:var(--pag-txt2);width:20px}
.mapa button:hover{background:color-mix(in srgb,var(--azul) 8%,transparent)}
.mapa button[aria-current="true"]{background:var(--azul);color:#fff}
.mapa button[aria-current="true"] .n{color:#cfe0f3}
.centro{display:flex;flex-direction:column;align-items:center;gap:12px}
.ayuda{font-size:13px;color:var(--pag-txt2);text-align:center;max-width:380px}
.nota{background:var(--panel);border:1px solid var(--panel-borde);border-radius:16px;padding:18px;position:sticky;top:16px}
.nota h3{margin:0 0 4px;font-size:17px}
.nota .sub{color:var(--pag-txt2);font-size:13px;margin:0 0 14px;line-height:1.5}
.nota h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pag-txt2);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-n{font:500 12px "Roboto Mono",monospace;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--azul) 10%,transparent);color:var(--pag-txt)}
.chip-n.t{background:color-mix(in srgb,var(--turq) 16%,transparent)}
.chip-n.d{background:color-mix(in srgb,var(--dorado) 22%,transparent)}
.api{font:500 12px/1.6 "Roboto Mono",monospace;margin:0;padding:0;list-style:none}
.api b{display:inline-block;min-width:44px;color:var(--turq)}
.nota ul.reg{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--pag-txt)}
.todas{display:none;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:28px;padding:24px;max-width:1500px;margin:0 auto}
.todas figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.todas figcaption{font-size:13px;font-weight:500;color:var(--pag-txt)}
body.modo-todas .lay{display:none}
body.modo-todas .todas{display:grid}
body.solo{background:transparent}
body.solo .cab,body.solo nav.mapa,body.solo .nota,body.solo .ayuda{display:none}
body.solo .lay{display:block;padding:0}
body.solo .centro{display:block}

/* ============ TELÉFONO ============ */
.tel{width:360px;height:740px;border-radius:44px;background:#0b0f16;padding:10px;box-shadow:0 20px 50px -20px rgba(15,23,36,.5);flex:none}
body.solo .tel{box-shadow:none}
.pant{width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--fondo);color:var(--txt);position:relative;display:flex;flex-direction:column;font-size:14px}
.estado{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:500;color:var(--txt);flex:none}
.estado.osc{background:var(--azul);color:#fff}
.estado i{display:inline-flex;gap:4px;font-style:normal}
.estado i span{width:14px;height:9px;border-radius:2px;background:currentColor;opacity:.85}
.bar{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;background:var(--azul);color:#fff;flex:none}
.bar.clara{background:var(--fondo);color:var(--txt)}
.bar h2{font-size:18px;font-weight:500;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;position:relative}
.ib:hover{background:rgba(255,255,255,.12)}
.bar.clara .ib:hover{background:rgba(0,0,0,.06)}
.ib .pto{position:absolute;top:7px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--dorado);color:var(--azul-osc);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
svg.ic{width:22px;height:22px;fill:currentColor;flex:none}
.cuerpo{flex:1;overflow-y:auto;padding:14px 16px 18px;scrollbar-width:none}
.cuerpo::-webkit-scrollbar{display:none}
.nav{display:flex;background:#fff;border-top:1px solid var(--borde);flex:none;padding:6px 4px 10px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--txt2)}
.nav button span.p{width:56px;height:28px;border-radius:14px;display:grid;place-items:center}
.nav button.act{color:var(--azul)}
.nav button.act span.p{background:var(--nieve)}
.card{background:var(--sup);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(15,23,36,.06),0 0 0 1px rgba(15,23,36,.04);margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:500}
.mut{color:var(--txt2);font-size:13px;line-height:1.45}
.sec{font-size:13px;font-weight:500;color:var(--txt2);margin:16px 2px 8px;display:flex;justify-content:space-between}
.sec a{color:var(--turq);text-decoration:none;cursor:pointer}
.b{border:0;border-radius:20px;height:44px;padding:0 20px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.b.p{background:var(--azul);color:#fff}
.b.p:disabled{background:#c5cfdb;color:#fff;cursor:not-allowed}
.b.t{background:var(--turq);color:#fff}
.b.o{background:transparent;color:var(--azul);box-shadow:inset 0 0 0 1px var(--borde)}
.b.r{background:transparent;color:var(--rojo);box-shadow:inset 0 0 0 1px #e6c3bf}
.b.txt{background:transparent;color:var(--azul);height:36px;width:auto;padding:0 8px}
.fila-b{display:flex;gap:10px;margin-top:10px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;font-weight:500;color:var(--txt2);margin:0 0 4px 4px}
.campo input,.campo textarea,.campo select{width:100%;border:1px solid var(--borde);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;color:var(--txt);background:#fff}
.campo textarea{resize:none;height:92px}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--azul);outline-offset:-1px}
.campo .ayu{font-size:11.5px;color:var(--txt2);margin:4px 4px 0;display:flex;justify-content:space-between}
.campo.err input,.campo.err textarea{border-color:var(--rojo)}
.campo.err .ayu{color:var(--rojo)}
.campo.ok input{border-color:var(--verde)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--txt);margin:8px 2px}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--azul);flex:none}
.chk a{color:var(--turq)}
.logo{width:72px;height:72px;margin:18px auto 10px;display:block}
.cent{text-align:center}
.h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.tag.az{background:var(--nieve);color:var(--azul)}
.tag.tq{background:#d7f1ee;color:#11695f}
.tag.dr{background:#fdecd0;color:#8a5a0c}
.tag.vd{background:#d9f2e4;color:#156b3f}
.tag.rj{background:#f8dcd9;color:#8e2a1f}
.tag.gr{background:#e7ebf0;color:#4a5563}
.dest{background:linear-gradient(135deg,var(--azul),#2a5585);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.dest::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(242,169,59,.18)}
.dest .k{font-size:12px;opacity:.85}
.dest .v{font-size:24px;font-weight:700;margin:4px 0}
.dest .b{background:var(--dorado);color:var(--azul-osc);height:38px;width:auto;margin-top:8px;position:relative;z-index:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acc{background:#fff;border-radius:16px;padding:14px;border:0;text-align:left;box-shadow:0 1px 2px rgba(15,23,36,.06),0 0 0 1px rgba(15,23,36,.04);color:var(--txt)}
.acc .icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.acc b{display:block;font-size:13.5px;font-weight:500}
.acc small{color:var(--txt2);font-size:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--borde);cursor:pointer}
.li:last-child{border-bottom:0}
.li .ico{width:40px;height:40px;border-radius:12px;background:var(--nieve);color:var(--azul);display:grid;place-items:center;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:500;font-size:14px}
.li .tx small{color:var(--txt2);font-size:12.5px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--borde);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:12px 0;font-weight:500;color:var(--txt2);border-bottom:3px solid transparent}
.tabs button.act{color:var(--azul);border-color:var(--azul)}
.pasos{display:flex;align-items:flex-start;margin:10px 0 4px}
.pasos div{flex:1;text-align:center;font-size:11px;color:var(--txt2);position:relative}
.pasos div::before{content:"";display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--borde);position:relative;z-index:1}
.pasos div::after{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--borde)}
.pasos div:first-child::after{display:none}
.pasos div.h{color:var(--txt);font-weight:500}
.pasos div.h::before{background:var(--turq);border-color:var(--turq)}
.pasos div.h::after{background:var(--turq)}
.pasos div.c::before{box-shadow:0 0 0 4px rgba(27,153,139,.2)}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla td{padding:8px 0;border-bottom:1px solid var(--borde);vertical-align:top}
.tabla td:last-child{text-align:right;white-space:nowrap}
.tot td{border:0;padding:4px 0}
.tot tr:last-child td{font-size:17px;font-weight:700;padding-top:8px}
.ok-ic{width:76px;height:76px;border-radius:50%;background:#d9f2e4;color:var(--verde);display:grid;place-items:center;margin:26px auto 14px}
.ok-ic svg{width:40px;height:40px}
.codigo{font:500 22px "Roboto Mono",monospace;letter-spacing:.04em;color:var(--azul);margin:6px 0}
.hoja{position:absolute;inset:0;background:rgba(15,23,36,.45);display:flex;align-items:flex-end;z-index:5}
.hoja .in{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 18px 20px}
.hoja .asa{width:36px;height:4px;border-radius:2px;background:var(--borde);margin:0 auto 12px}
.radio{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:14px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--azul)}
.estrellas{display:flex;justify-content:center;gap:6px;margin:12px 0 6px}
.estrellas button{border:0;background:transparent;color:#cdd5df;padding:2px}
.estrellas button.on{color:var(--dorado)}
.estrellas svg{width:40px;height:40px;fill:currentColor}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}
.tl li::before{content:"";position:absolute;left:0;top:4px;width:10px;height:10px;border-radius:50%;background:var(--turq)}
.tl li::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:2px;background:var(--borde)}
.tl li:last-child::after{display:none}
.tl li small{display:block;color:var(--txt2);font-size:11.5px}
.banner{display:flex;gap:10px;align-items:center;background:#fdecd0;color:#6b4708;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.snack{position:absolute;left:12px;right:12px;bottom:76px;background:#283447;color:#fff;border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:6;animation:sube .25s ease}
@keyframes sube{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde)}
.prod:last-child{border:0}
.prod .tx{flex:1}
.prod .tx b{font-weight:500;font-size:13.5px;display:block}
.prod .tx small{color:var(--txt2);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--borde);border-radius:18px}
.step button{border:0;background:transparent;width:30px;height:30px;color:var(--azul);display:grid;place-items:center}
.step span{min-width:18px;text-align:center;font-weight:500}
.sw{width:46px;height:26px;border-radius:13px;background:#c5cfdb;position:relative;border:0;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--turq)}
.sw.on::after{left:23px}
.fab{position:absolute;right:16px;bottom:84px;height:52px;border-radius:16px;background:var(--dorado);color:var(--azul-osc);border:0;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:0 6px 16px rgba(15,23,36,.25)}
.foto{border:1.5px dashed var(--borde);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--txt2);font-size:13px;cursor:pointer;background:#fff}
.foto.lista{border-style:solid;border-color:var(--turq);color:var(--txt)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cats button{border:1px solid var(--borde);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--txt)}
.cats button.on{background:var(--nieve);border-color:var(--azul);color:var(--azul);font-weight:500}
.oferta{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(15,23,36,.06),0 0 0 1px rgba(15,23,36,.04);margin-bottom:12px}
.oferta .top{padding:14px;background:linear-gradient(135deg,#11695f,var(--turq));color:#fff}
.oferta .top.az{background:linear-gradient(135deg,var(--azul),#2a5585)}
.oferta .top b{font-size:17px;display:block;margin-top:4px}
.oferta .bot{padding:12px 14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--borde);font-size:13.5px}
.kv span:first-child{color:var(--txt2)}
.kv:last-child{border:0}
@media (max-width:1100px){
  .lay{grid-template-columns:1fr;padding:16px}
  nav.mapa,.nota{position:static}
  .mapa{display:flex;flex-wrap:wrap;gap:4px}
  .mapa h2{width:100%}
  .mapa button{width:auto}
}
@media (max-width:420px){
  .tel{width:100%;max-width:360px;height:720px;padding:6px;border-radius:38px}
  .cab{padding:12px 16px;flex-wrap:wrap}
  .cab .der{margin-left:0}
}

/* =====================================================================
   CAPA "LIQUID GLASS"
   Página: Liquid Glass completo (vidrio translúcido, desenfoque, brillo
   especular, cápsulas). Pantallas del celular: Material 3 con detalles de
   vidrio, que es el estilo que tendrán las apps Android.
   ===================================================================== */
:root{
  --lg-bg:#EAF0F7; --lg-panel:rgba(255,255,255,.52); --lg-panel-2:rgba(255,255,255,.70);
  --lg-borde:rgba(255,255,255,.78); --lg-brillo:rgba(255,255,255,.95); --lg-sombra:0 1px 1px rgba(20,40,66,.04),0 18px 40px -16px rgba(20,40,66,.30);
  --lg-blur:blur(26px) saturate(185%);
  --pag:#EAF0F7; --panel:var(--lg-panel); --panel-borde:var(--lg-borde);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --lg-bg:#0B1220; --lg-panel:rgba(30,42,62,.46); --lg-panel-2:rgba(30,42,62,.70);
    --lg-borde:rgba(255,255,255,.14); --lg-brillo:rgba(255,255,255,.22); --pag:#0B1220; --panel:var(--lg-panel); --panel-borde:var(--lg-borde); }
}
:root[data-theme="dark"]{ --lg-bg:#0B1220; --lg-panel:rgba(30,42,62,.46); --lg-panel-2:rgba(30,42,62,.70);
  --lg-borde:rgba(255,255,255,.14); --lg-brillo:rgba(255,255,255,.22); --pag:#0B1220; --panel:var(--lg-panel); --panel-borde:var(--lg-borde); }

body{background:var(--lg-bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Roboto,"Segoe UI",Arial,sans-serif;letter-spacing:-.006em}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38vmax 38vmax at 12% 18%, rgba(27,153,139,.55), transparent 60%),
    radial-gradient(42vmax 42vmax at 88% 12%, rgba(31,58,95,.55), transparent 62%),
    radial-gradient(36vmax 36vmax at 70% 92%, rgba(242,169,59,.45), transparent 60%),
    radial-gradient(30vmax 30vmax at 20% 88%, rgba(120,150,255,.35), transparent 60%);
  filter:blur(30px);animation:lg-flota 26s ease-in-out infinite alternate}
@keyframes lg-flota{to{transform:translate(3vmax,2vmax) scale(1.06)}}
body.solo::before{display:none}

/* Paneles de la página: vidrio */
.cab,nav.mapa,.nota{background:var(--lg-panel)!important;-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
  border:1px solid var(--lg-borde)!important;box-shadow:inset 0 1px 0 var(--lg-brillo),var(--lg-sombra)}
.cab{position:sticky;top:12px;z-index:20;margin:12px auto 0;max-width:1296px;border-radius:999px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--lg-borde)!important}
.cab h1{font-weight:700;letter-spacing:-.02em}
nav.mapa,.nota{border-radius:26px}
nav.mapa{top:96px}.nota{top:96px}
.mapa button{border-radius:14px;transition:background .2s,transform .15s}
.mapa button[aria-current="true"]{background:linear-gradient(135deg,#1F3A5F,#2B5C8F);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 14px -6px rgba(31,58,95,.7)}
.btn-pag{border-radius:999px;background:var(--lg-panel-2);border:1px solid var(--lg-borde);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
  box-shadow:inset 0 1px 0 var(--lg-brillo);font-weight:600;padding:8px 16px}

<script>

if (params.has('solo')) document.body.classList.add('solo');
if (params.get('hoja')) E.hoja = true;

function telefono(id) {
  return `<div class="tel"><div class="pant" data-pant="${id}">${P[id].html()}${E.snack && id === actual ? `<div class="snack">${E.snack}</div>` : ''}</div></div>`;
}

function pintar() {
  document.getElementById('telefono').innerHTML = telefono(actual);
  const p = P[actual];
  const n = ORDEN.indexOf(actual) + 1;
  document.getElementById('nota').innerHTML = `
    <p class="mut" style="margin:0 0 4px;font-size:12px;color:var(--pag-txt2)">Pantalla ${n} de ${ORDEN.length} · ${p.grupo}</p>
    <h3>${p.t}</h3><p class="sub">${p.sub}</p>
    <h4>Historias de usuario</h4><div class="chips">${p.hu.map(x => `<span class="chip-n">${x}</span>`).join('')}</div>
    <h4>Requisitos</h4><div class="chips">${p.rf.map(x => `<span class="chip-n t">${x}</span>`).join('')}</div>
    <h4>Endpoints (contrato de API)</h4><ul class="api">${p.api.map(([m, u]) => `<li><b>${m}</b>${u}</li>`).join('')}</ul>
    <h4>Tablas</h4><div class="chips">${p.tablas.map(x => `<span class="chip-n d">${x}</span>`).join('')}</div>
    <h4>Reglas y detalles</h4><ul class="reg">${p.reglas.map(x => `<li>${x}</li>`).join('')}</ul>`;
  document.querySelectorAll('#mapa button').forEach(b => b.setAttribute('aria-current', b.dataset.p === actual));
}

function mapa() {
  let g = '', h = '';
  ORDEN.forEach((id, i) => {
    if (P[id].grupo !== g) { g = P[id].grupo; h += `<h2>${g}</h2>`; }
    h += `<button data-p="${id}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${P[id].t}</button>`;
  });
  document.getElementById('mapa').innerHTML = h;
}

function todas() {
  document.getElementById('todas').innerHTML = ORDEN.map((id, i) =>
    `<figure>${telefono(id)}<figcaption>${String(i + 1).padStart(2, '0')} · ${P[id].t}</figcaption></figure>`).join('');
}

function ir(id, snack = '') {
  actual = id; E.snack = snack; E.hoja = false;
  pintar();
  const c = document.querySelector('#telefono .cuerpo'); if (c) c.scrollTop = 0;
  if (snack) setTimeout(() => { if (E.snack === snack) { E.snack = ''; const s = document.querySelector('#telefono .snack'); if (s) s.remove(); } }, 2600);
}

/* ===================== Interacción ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-ir], [data-foto]');
  if (!t) return;
  if (t.dataset.p) return ir(t.dataset.p);
  if (t.closest('.todas')) return;
  if (t.hasAttribute('data-llenar')) { Object.assign(E, { ruc: '20612345671', razon: 'Ferretería El Tambo SAC', contacto: 'Rosa Quispe', cel: '964123456', correo: 'rosa@ferreteriaeltambo.pe', clave: 'cliente123', consiente: true }); return pintar(); }
  if (t.dataset.cant) { const id = t.dataset.cant; E.cant[id] = Math.max(0, Math.min(50, E.cant[id] + Number(t.dataset.d))); return pintar(); }
  if (t.dataset.tab) { E.tab = t.dataset.tab; return pintar(); }
  if (t.dataset.cat) { E.cat = t.dataset.cat; return pintar(); }
  if (t.dataset.estrella) { E.estrellas = Number(t.dataset.estrella); return pintar(); }
  if (t.dataset.interes !== undefined) { E.interes[t.dataset.interes] = true; return pintar(); }
  if (t.hasAttribute('data-foto')) { E.foto = !E.foto; return pintar(); }
  if (t.hasAttribute('data-switch')) { E.ofertas = !E.ofertas; return pintar(); }
  if (t.hasAttribute('data-hoja')) { E.hoja = true; return pintar(); }
  if (t.hasAttribute('data-cerrar-hoja')) { E.hoja = false; E.motivo = ''; return pintar(); }
  if (t.hasAttribute('data-aceptar')) { E.aceptada = true; return ir('aceptada'); }
  if (t.hasAttribute('data-rechazar')) { E.hoja = false; return ir('cotizaciones', 'Cotización rechazada. Tu asesor recibirá el motivo.'); }
  if (t.dataset.ir) { if (t.disabled) return; return ir(t.dataset.ir, t.dataset.snack || ''); }
  if (t.dataset.snack) { E.snack = t.dataset.snack; pintar(); setTimeout(() => { E.snack = ''; pintar(); }, 2400); }
});

document.addEventListener('input', e => {
  const c = e.target.dataset.campo;
  if (!c) return;
  if (e.target.type === 'checkbox') { E[c] = e.target.checked; return pintar(); }
  let v = e.target.value;
  if (c === 'ruc' || c === 'cel') v = v.replace(/\D/g, '');
  E[c] = v;
  if (['ruc', 'cel', 'correo', 'clave', 'razon', 'contacto', 'desc'].includes(c)) {
    const pos = e.target.selectionStart;
    pintar();
    const el = document.querySelector(`#telefono [data-campo="${c}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }
});
document.addEventListener('change', e => { if (e.target.dataset.motivo !== undefined) { E.motivo = e.target.value; pintar(); } });

document.getElementById('btnTodas').onclick = () => { todas(); document.body.classList.add('modo-todas'); btnTodas.setAttribute('aria-pressed', true); btnUna.setAttribute('aria-pressed', false); };
document.getElementById('btnUna').onclick = () => { document.body.classList.remove('modo-todas'); btnUna.setAttribute('aria-pressed', true); btnTodas.setAttribute('aria-pressed', false); };

mapa(); pintar();
</script>
</body>
</html>
